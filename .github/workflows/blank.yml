
name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar projeto Android
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERRO: arquivo settings.gradle(.kts) não encontrado."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

      - name: Construir APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Gospel-do-Alan-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
